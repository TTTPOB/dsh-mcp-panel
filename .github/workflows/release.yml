name: release

on:
  push:
    tags: ['v*-fork*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag
        required: true
        type: string

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=4096
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Verify release commit and version
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node scripts/check-tag-version.mjs "$RELEASE_TAG"
      - run: pnpm install --frozen-lockfile
      - name: Validate and build release
        run: |
          pnpm run typecheck:ci
          pnpm test
          pnpm run lint
          pnpm run check:readmes
          pnpm run build
          pnpm run verify:self-contained
          pnpm run verify:artifacts
          pnpm pack
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          node scripts/changelog-section.mjs "${RELEASE_TAG#v}" > release-notes.md
          gh release create "$RELEASE_TAG" ./*.tgz --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md
